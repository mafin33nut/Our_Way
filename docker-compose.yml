services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE: ghcr.io/astral-sh/uv:python3.11-trixie-slim
    env_file:
      - .env
    ports:
      - "21772:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        FRONTEND_BASE: ghcr.io/astral-sh/uv:python3.11-trixie-slim
    environment:
      BACKEND_HOST: ${FRONTEND_BACKEND_HOST:-backend}
      BACKEND_PORT: ${FRONTEND_BACKEND_PORT:-8000}
    ports:
      - "21771:80"
    depends_on:
      - backend
    restart: unless-stopped
