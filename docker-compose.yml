services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE: ${PYTHON_BASE_IMAGE:-docker.io/library/python:3.11-slim}
    env_file:
      - .env
    ports:
      - "21772:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        FRONTEND_BASE: ${FRONTEND_BASE_IMAGE:-docker.io/library/python:3.11-slim}
    ports:
      - "21771:80"
    depends_on:
      - backend
    restart: unless-stopped
